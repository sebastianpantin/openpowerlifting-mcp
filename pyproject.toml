[project]
name = "openpowerlifting-mcp"
version = "0.1.0"
description = "MCP server for querying OpenPowerlifting meet results"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian P Liljevall" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
openpowerlifting-mcp = "opl_mcp.server:main"
opl = "opl_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opl_mcp"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
